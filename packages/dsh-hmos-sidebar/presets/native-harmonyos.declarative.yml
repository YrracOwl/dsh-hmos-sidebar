# The `native-harmonyos` agent preset in the DECLARATIVE shape DSH 0.1.7-rc.1
# introduced: an ordinary Cordis ENTRY LIST (not a patch list) whose one row
# declares `@deepseek-ai/dsh-agent-preset`. A directory preset — the shape
# `presets/native-harmonyos/` still uses — is not discovered by that roster.
#
# Twin: `presets/native-harmonyos/` (agent.cordis.yml + preset.yml + skills/)
# is the SAME preset for ≤ 0.1.5, where the roster mounts directory presets.
# Keep the two row-for-row equivalent. `scripts/preset-declarative-check.mjs`
# in the workspace root parses both with the loader's YAML dialect and fails
# when a row id, name, realm, or persona value drifts. The intended deltas are
# only the ones DSH 0.1.7-rc.1 forces:
#
#   1. `@deepseek-ai/dsh-workflow-worker-thread` → `@deepseek-ai/dsh-workflow-ptc`
#      (row id `workflow-worker-thread` → `workflow-ptc`). rc.1 ships no alias;
#      the row keeps `config.provider: spawn`.
#   2. The `skills/` directory is resolved from THIS package's install path,
#      because a declarative preset has no directory of its own to hang a
#      `new URL('skills/', baseUrl)` off. bare-specifier resolution from
#      `baseUrl` reaches the profile's `node_modules`, so no absolute machine
#      path is stored anywhere.
#   3. Product `tool-subagent` rows carry rc.1's config vocabulary
#      (`backgroundMode: one-shot` + `maxDepth: provider-managed`, replacing
#      `enableRunInBackground: false`). Both stay `disabled`.
#   4. Display metadata that lived in `preset.yml` is inline here as
#      `config.name` / `config.description` / `config.order`.
#
# How it mounts: `dsh-hmos-sidebar install-presets` detects a host that provides
# the declarative registry and writes a small managed block into the active
# profile's `cordis.patch.yml`:
#
#   - insert:
#       - id: hmos-preset-native-harmonyos
#         name: cordis:include
#         config:
#           path: ./node_modules/dsh-hmos-sidebar/presets/native-harmonyos.declarative.yml
#
# `cordis:include` re-bases `baseUrl` to this file's own directory, which is
# what makes the `!!js` expressions below (and every bare specifier) resolve.
# Editing the composition here is enough to change the preset on a ≥ 0.1.7
# host; the profile needs a restart (the patch layer is watched, so a reload
# often suffices) for the roster to rebuild its standing generation.
#
# Plane rule unchanged from the directory twin: rows that PUBLISH a service sit
# inside a group carrying an `isolate` realm; rows that only consume a host
# registry (shell, filesystem, jobs, skills, goals, the 41 dcli__* tools) stay
# loose. A provider left in the root realm is rejected at mount.
- id: preset-native-harmonyos
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: native-harmonyos
    name: "原生鸿蒙开发"
    order: 5
    description: "面向 HarmonyOS 原生应用开发的垂类 Agent：以 PTC 模式为执行形态（通过 PTC SDK 的 run_code 组合多步操作），集成 ArkTS/C++ 静态检查、41 项 dcli__* 工具链、真机 UI 自动验证、场景契约式特性交付与本地 HarmonyOS 知识技能。"
    plugins:
      # ── identity ──────────────────────────────────────────────────────────
      #
      # The preset's own persona, shadowing the deployment default for this
      # agent. `{{model}}` and `{{cwd}}` resolve from the agent's own route and
      # workspace. `prefix` is REQUIRED since DSH 0.1.5-rc.1 (the pre-0.1.5
      # `text` key is gone and fails the mount); rc.1 keeps the same contract.
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: >-
            你是一名原生鸿蒙（HarmonyOS）应用开发专家，工作目录是 {{cwd}}（模型 {{model}}）。

            执行形态：PTC 模式——计划阶段用 plan mode（exit_plan_mode 提交完整计划），
            追踪用 todo_write，编码用 PTC Mode：通过 PTC SDK 的 run_code 编写 TypeScript 程序组合多步操作
            （一个程序内多次 SDK 工具调用，一次往返完成；SDK 覆盖全部工具，含 41 个 dcli__*）。

            最高优先级规则：
            1. 修改 .ets / C/C++ 源码后必须先用 dcli__lsp_check 验证（files 传改动文件，
               projectPath 传工程根），诊断清零再继续；LSP 卡死时用 dcli__lsp_restart。
            2. 动手前先读 build-profile.json5 / oh-package.json5 / module.json5，理解工程结构。
            3. 构建/运行/日志/文档优先走 dcli__* 工具；仅当能力尚未封装且任务确实需要时，
               才调用 devecocli 命令，并先用 --help 核对参数。
            4. 跨页面/新能力/要设备验收的特性按 sdd-feature（验收契约落盘 docs/feature-contracts/）；UI 功能用 dcli__build_project +
               dcli__install_hap 装到真机/模拟器，用 dcli__ui_layout/click/swipe/text 操作，配合 dcli__ui_screenshot 截图 +
               read_image 看图逐项验证界面与交互（改 .ets / C/C++ 后先 dcli__lsp_check 清零诊断再跑 UI）。
            5. API 用法不确定先查文档（hmos-doc-research / dcli__docs_search），禁止臆造。
            6. 仅当用户明确要求 Ralph / 新鲜代理迭代时使用 ralph 工具（每轮写明不可变目标
               与完成标准）；普通长任务用 goal，有限委派用 subagent。

            详细流程按需加载技能：native-harmonyos / arkui-state / arkui-api-quickref /
            hmos-ui-verify / sdd-feature / hmos-doc-research / hmos-debug-logs /
            hmos-build-sign-release / hmos-system-capabilities / hmos-agents-md /
            hmos-code-review（交付前代码审查：机器检查 + LLM 逐项审查 + 分级报告）/
            dcli-tools-reference（dcli__* 工具参数速查，调用前先查，避免臆造参数）。

      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536

      # ── shell ─────────────────────────────────────────────────────────────
      #
      # `shell-env` stays in the HOST composition (`apps/cli` injects it to
      # publish DSH_WEB_URL/DSH_WEB_MODE), so these two tools consume the host
      # registry from here; their executors are host-plane too.
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'

      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'

      # ── filesystem ────────────────────────────────────────────────────────
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'

      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false

      # ── background jobs ───────────────────────────────────────────────────
      #
      # Only the model-facing controls. The job REGISTRY stays on the host
      # plane: its producers sit outside any realm this file could put it in,
      # and an entry-local realm here is invisible to every sibling row.
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'

      # ── skills ────────────────────────────────────────────────────────────
      #
      # The skill REGISTRY is host-plane and layered per scope: these rows
      # register into THIS preset's layer, so they need no realm. The catalog
      # also carries whatever the deployment registered globally.
      #
      # The skills directory ships inside this package next to the twin
      # directory preset; `createRequire(baseUrl).resolve(...)` locates the
      # installed package without storing a machine path. This is the same
      # idiom the shipped rc.1 `cordis` preset uses for its own skills.
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
        config:
          customSkillDirs:
            - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-hmos-sidebar/package.json')), 'presets', 'native-harmonyos', 'skills')"

      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'

      # ── goals ─────────────────────────────────────────────────────────────
      #
      # Only the model-facing tool. The goal SERVICE, its session driver, and
      # `/goal` stay host-plane: the Gateway serves the goal domain as Remote
      # endpoints resolved on the host, so an entry-local realm here would hide
      # it. What a preset chooses is whether its agent can call the tool.
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'

      # ── plan mode ─────────────────────────────────────────────────────────
      #
      # Plan state is per-agent by nature, so an entry-local realm is the
      # correct lifetime rather than a workaround.
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

      # ── compaction ────────────────────────────────────────────────────────
      #
      # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the
      # pruner must share this realm rather than sit outside it. `tokenMeter`
      # is deliberately NOT in this realm: the meter is host-plane and owns the
      # context-meter projection units the browser reads for every session.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'

          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'

          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024

      # ── delegation and workflows ──────────────────────────────────────────
      #
      # The `subagents` registry and its spawn/fork backends are host-plane:
      # the registry is a process singleton whose cross-session queries the
      # api-proxy serves, and a provider name registers only once. This preset
      # contributes the delegation TOOLS, which resolve that host registry.
      #
      # `workflows` is different — nothing outside an agent reads it — so every
      # row reaching it shares one entry-local realm here; a consumer left
      # outside would resolve a host registry this preset does not populate.
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'

          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: continuable

          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
              backgroundMode: continuable

          # Product providers are host-plane singletons. Remove `disabled` from
          # either row to expose that product to agents composed from a copy.
          - id: tool-subagent-codex
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: codex
              toolName: subagent_codex
              backgroundMode: one-shot
              maxDepth: provider-managed

          - id: tool-subagent-claude-code
            name: '@deepseek-ai/dsh-tool-subagent'
            disabled: true
            config:
              provider: claude-code
              toolName: subagent_claude_code
              backgroundMode: one-shot
              maxDepth: provider-managed

          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn

          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'

          - id: tool-ralph
            name: '@deepseek-ai/dsh-tool-ralph'
            config:
              subagentProvider: spawn
              maxRounds: 64

      # ── remaining model-facing rows ───────────────────────────────────────
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'

      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true

      # The `web` service and its search provider are host-plane; only the
      # model-facing tool is per-session.
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: false
          searchTimeoutMs: 60000

      # The 41 native dev toolchain commands live in the `dsh-hmos-sidebar`
      # package's `tools` submodule. This plain consumer row mounts them into
      # THIS preset's layer of the host `tools` registry (no realm — it
      # publishes nothing, so only sessions on this preset expose them).
      #
      # No config is pinned: cliPath / projectPath / devEcoHome come from the
      # environment or auto-detection, so the row carries no machine paths.
      - id: tool-hmos-tools
        name: 'dsh-hmos-sidebar/tools'

      # ── presentation: PTC Mode ────────────────────────────────────────────
      #
      # 鸿蒙开发以写代码为主，本预设把工具呈现为 PTC 模式：模型写 TypeScript 程序
      # 经 run_code 一次执行多步操作，减少往返。注册表本身留在宿主平面，本行只声明
      # 本预设的呈现方式，native 会话可与 PTC 会话同进程并存。
      # 宿主组合已组装 PTC 运行时（0.1.7-rc.1 起为 @deepseek-ai/dsh-ptc-runtime-node），
      # 故不会因缺运行时挂载失败。改为 both 可保留原生工具直呼 + run_code 并存。
      - id: tool-presentation
        name: '@deepseek-ai/dsh-agent-tool-presentation'
        config:
          mode: ptc
