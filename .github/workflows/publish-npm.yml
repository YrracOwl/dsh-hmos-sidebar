name: Release and publish dsh-hmos-sidebar

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-dsh-hmos-sidebar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-and-publish:
    # HarmonyOS package declares os: [win32] and its tests exercise Windows
    # path, junction, and CLI behavior; Linux cannot install or validate it.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/dsh-hmos-sidebar
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/dsh-hmos-sidebar/package.json
      - name: Upgrade npm for Trusted Publishing
        run: npm install --global npm@latest
      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $packageVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $packageVersion) { throw "Tag $tagVersion does not match package version $packageVersion" }
      - name: Install dependencies without lifecycle scripts
        run: npm install --no-package-lock --ignore-scripts
      - name: Run tests
        run: npm test
      - name: Verify package contents
        run: npm pack --dry-run
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data: releases } = await github.rest.repos.listReleases({ owner: context.repo.owner, repo: context.repo.repo })
            if (!releases.some((release) => release.tag_name === tag)) {
              await github.rest.repos.createRelease({ owner: context.repo.owner, repo: context.repo.repo, tag_name: tag, target_commitish: context.sha, generate_release_notes: true })
            }
      - name: Publish with npm Trusted Publishing
        run: npm publish --access public --provenance
